# Builds the site and uploads dist/ to Hostinger over FTP on every push to main.
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    e.g. ftp.seudominio.com.br or the IP shown in hPanel
#   FTP_USERNAME  the FTP account user from hPanel
#   FTP_PASSWORD  that account's password
# Optional repository variable FTP_SERVER_DIR (defaults to ./, the FTP account's own
# folder, which on this Hostinger account is already the site's public_html).
name: Deploy na Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o build
        run: npm run build

      # Hostinger resets FTP data connections now and then; the same upload
      # usually goes through on a retry, so try up to three times.
      - name: Enviar para a Hostinger
        id: envio1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          # Hostinger drops plain-FTP data connections; FTPS keeps them open.
          # The certificate is checked (strict); FTP_SERVER must then be the host
          # name the certificate was issued for, not the bare IP.
          protocol: ${{ vars.FTP_PROTOCOL || secrets.FTP_PROTOCOL || 'ftps' }}
          security: ${{ vars.FTP_SECURITY || secrets.FTP_SECURITY || 'strict' }}
          timeout: 120000

      - name: Enviar para a Hostinger (tentativa 2)
        id: envio2
        if: steps.envio1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          # Hostinger drops plain-FTP data connections; FTPS keeps them open.
          # The certificate is checked (strict); FTP_SERVER must then be the host
          # name the certificate was issued for, not the bare IP.
          protocol: ${{ vars.FTP_PROTOCOL || secrets.FTP_PROTOCOL || 'ftps' }}
          security: ${{ vars.FTP_SECURITY || secrets.FTP_SECURITY || 'strict' }}
          timeout: 120000

      - name: Enviar para a Hostinger (tentativa 3)
        id: envio3
        if: steps.envio1.outcome == 'failure' && steps.envio2.outcome == 'failure'
        continue-on-error: false
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          # Hostinger drops plain-FTP data connections; FTPS keeps them open.
          # The certificate is checked (strict); FTP_SERVER must then be the host
          # name the certificate was issued for, not the bare IP.
          protocol: ${{ vars.FTP_PROTOCOL || secrets.FTP_PROTOCOL || 'ftps' }}
          security: ${{ vars.FTP_SECURITY || secrets.FTP_SECURITY || 'strict' }}
          timeout: 120000
