# Builds the site and uploads dist/ to Hostinger over FTP on every push to main.
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    e.g. ftp.seudominio.com.br or the IP shown in hPanel
#   FTP_USERNAME  the FTP account user from hPanel
#   FTP_PASSWORD  that account's password
# Optional repository variable FTP_SERVER_DIR (defaults to public_html/).
name: Deploy na Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o build
        run: npm run build

      - name: Enviar para a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
